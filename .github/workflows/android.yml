
name: Build Eventuales Monitor APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK is complete
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -Eq 'classes[0-9]*\.dex'
          DEX_SIZE=$(unzip -l "$APK" 'classes.dex' | awk '/classes.dex$/ {print $1}')
          test -n "$DEX_SIZE"
          test "$DEX_SIZE" -gt 10000
          echo "APK validada correctamente."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eventuales-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
